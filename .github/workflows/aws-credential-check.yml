name: AWS credential check

on:
  workflow_dispatch:

permissions: {}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check credentials with AWS STS
        shell: bash
        env:
          AWS_CREDS: ${{ secrets.AWS_CREDS }}
        run: |
          set -euo pipefail
          if [[ -z "$AWS_CREDS" ]]; then
            echo "::error::Set the AWS_CREDS Actions secret first."
            exit 1
          fi

          umask 077
          creds_dir=$(mktemp -d)
          export AWS_SHARED_CREDENTIALS_FILE="$creds_dir/creds"
          trap 'rm -f "$AWS_SHARED_CREDENTIALS_FILE"; rmdir "$creds_dir"' EXIT
          printf '%s\n' "$AWS_CREDS" > "$AWS_SHARED_CREDENTIALS_FILE"
          unset AWS_CREDS

          credentials=$(aws configure export-credentials --profile default --format process)
          curl_config=$(jq -er '
            "user = " + ("\(.AccessKeyId):\(.SecretAccessKey)" | @json),
            (if .SessionToken then
               "header = " + ("x-amz-security-token: \(.SessionToken)" | @json)
             else empty end)
          ' <<< "$credentials")

          # Use curl for the signed request so the full User-Agent can be set verbatim.
          curl --disable --config - \
            --aws-sigv4 'aws:amz:us-east-1:sts' \
            --user-agent 'aws-sdk-go-v2/1.24.1 os/linux lang/go#1.23.2 md/GOOS#linux md/GOARCH#amd64 api/sts#1.26.7 GHAS-AWS_KEYID-validation-1.0.0-This-call-originates-from-an-automated-process-that-tests-AWS_KEYIDs-committed-to-GitHub-repos.-Please-contact-secret-scanning-github.com-for-more-info' \
            --silent --show-error --fail --max-time 30 --output /dev/null \
            'https://sts.us-east-1.amazonaws.com/?Action=GetCallerIdentity&Version=2011-06-15' \
            <<< "$curl_config"
          echo "AWS STS accepted the credentials."

      - name: Check Slack user token
        if: ${{ !cancelled() }}
        shell: bash
        env:
          SLACK_USER_TOKEN: ${{ secrets.SLACK_USER_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "$SLACK_USER_TOKEN" ]]; then
            echo "::error::Set the SLACK_USER_TOKEN Actions secret first."
            exit 1
          fi

          curl_config=$(printf '%s' "$SLACK_USER_TOKEN" |
            jq -Rsr '"header = " + ("Authorization: Bearer " + . | @json)')
          unset SLACK_USER_TOKEN

          # Slack can return HTTP 200 even when it rejects a token.
          if ! curl --disable --config - \
            --request POST \
            --user-agent 'ApiApp/XXXXXXXXXXX GHAS-SLACK-validation/1.0.0 This call originates from an automated process that tests SLACKs committed to GitHub repos. For questions on our processes, please contact secret-scanning@github.com.' \
            --silent --show-error --fail --max-time 30 \
            'https://slack.com/api/auth.test' \
            <<< "$curl_config" | jq -e '.ok == true' > /dev/null; then
            echo "::error::Slack auth.test did not confirm the token."
            exit 1
          fi
          echo "Slack accepted the token."
