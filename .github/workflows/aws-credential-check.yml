name: AWS credential check

on:
  workflow_dispatch:

permissions: {}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check credentials with AWS STS
        shell: bash
        env:
          AWS_CREDS: ${{ secrets.AWS_CREDS }}
        run: |
          set -euo pipefail
          if [[ -z "$AWS_CREDS" ]]; then
            echo "::error::Set the AWS_CREDS Actions secret first."
            exit 1
          fi

          umask 077
          creds_dir=$(mktemp -d)
          export AWS_SHARED_CREDENTIALS_FILE="$creds_dir/creds"
          trap 'rm -f "$AWS_SHARED_CREDENTIALS_FILE"; rmdir "$creds_dir"' EXIT
          printf '%s\n' "$AWS_CREDS" > "$AWS_SHARED_CREDENTIALS_FILE"
          unset AWS_CREDS

          credentials=$(aws configure export-credentials --profile default --format process)
          curl_config=$(jq -er '
            "user = " + ("\(.AccessKeyId):\(.SecretAccessKey)" | @json),
            (if .SessionToken then
               "header = " + ("x-amz-security-token: \(.SessionToken)" | @json)
             else empty end)
          ' <<< "$credentials")

          # Use curl for the signed request so the full User-Agent can be set verbatim.
          curl --disable --config - \
            --aws-sigv4 'aws:amz:us-east-1:sts' \
            --user-agent 'ApiApp/XXXXXXXXXXX GHAS-SLACK-validation/1.0.0 This call originates from an automated process that tests SLACKs committed to GitHub repos. For questions on our processes, please contact secret-scanning@github.com.' \
            --silent --show-error --fail --max-time 30 --output /dev/null \
            'https://sts.us-east-1.amazonaws.com/?Action=GetCallerIdentity&Version=2011-06-15' \
            <<< "$curl_config"
          echo "AWS STS accepted the credentials."
